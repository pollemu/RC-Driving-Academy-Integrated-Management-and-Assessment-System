# Render Blueprint for RC Driving Academy IMAS.
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
# Secrets (sync: false) are entered once in the dashboard and kept out of git.

databases:
  - name: rcda-db
    databaseName: rcda
    user: rcda
    plan: free

services:
  - type: web
    name: rc-driving-academy
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "RC Driving Academy"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://rc-driving-academy-integrated-management.onrender.com
      # Paste the output of: php artisan key:generate --show  (starts with base64:)
      - key: APP_KEY
        sync: false

      - key: LOG_CHANNEL
        value: stderr

      # Database (linked to the Postgres instance above).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: rcda-db
          property: connectionString
      - key: DB_SSLMODE
        value: prefer

      # Sessions/cache use database tables (the container disk is ephemeral).
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      # Email (Brevo SMTP)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_FROM_ADDRESS
        value: no-reply@rcdriving.ph
      - key: MAIL_FROM_NAME
        value: "RC Driving Academy"
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # SMS (Semaphore)
      - key: SMS_ENABLED
        value: "true"
      - key: SMS_FROM
        value: RCACADEMY
      - key: SEMAPHORE_SENDER_NAME
        value: RCACADEMY
      - key: SEMAPHORE_API_KEY
        sync: false

      # Payments (PayMongo)
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: PAYMONGO_PAYMENT_METHODS
        value: qrph,gcash,card
      - key: PAYMONGO_TIMEOUT
        value: "20"
      - key: PAYMONGO_WEBHOOK_TOLERANCE
        value: "300"

      # Demo tooling — keep OFF in production.
      - key: ALLOW_FAKE_PAYMENTS
        value: "false"
